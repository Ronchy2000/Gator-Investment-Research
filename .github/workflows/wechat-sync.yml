name: WeChat Article Sync

on:
  schedule:
    # 08:30 Asia/Shanghai (GitHub cron uses UTC).
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: Maximum article-list pages to inspect
        required: false
        default: "20"

permissions:
  contents: write
  issues: write

concurrency:
  group: wechat-article-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WEREAD_VID: ${{ secrets.WEREAD_VID }}
      WEREAD_TOKEN: ${{ secrets.WEREAD_TOKEN }}
      WEREAD_PLATFORM_URL: ${{ secrets.WEREAD_PLATFORM_URL }}
      SYNC_MAX_PAGES: ${{ inputs.max_pages || '20' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check synchronization credentials
        id: credentials
        continue-on-error: true
        shell: bash
        run: |
          if [[ -z "$WEREAD_VID" || -z "$WEREAD_TOKEN" ]]; then
            echo "::error title=Repository Secret 名称或配置错误::未读取到 WEREAD_VID 或 WEREAD_TOKEN。Secret 名称必须完整包含 WEREAD_ 前缀，VID 和 TOKEN 无效。"
            {
              echo "## Repository Secrets 配置错误"
              echo
              echo '请在 `Settings -> Secrets and variables -> Actions` 中确认以下两个完整名称：'
              echo
              echo '- `WEREAD_VID`'
              echo '- `WEREAD_TOKEN`'
              echo
              echo '`VID` 和 `TOKEN` 是错误名称，工作流无法读取；修改名称不需要重新扫码。'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-wechat.txt

      - name: Install synchronizer dependencies
        run: pip install -r requirements-wechat.txt

      - name: Synchronize articles
        id: synchronize
        if: steps.credentials.outcome == 'success'
        continue-on-error: true
        run: python -m wechat_sync.sync --max-pages "$SYNC_MAX_PAGES" --delay 3

      - name: Detect generated changes
        id: changes
        if: always()
        shell: bash
        run: |
          status="$(git status --porcelain -- src/content/articles public/article-assets wechat_sync/index.json)"
          if [[ -n "$status" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate generated archive
        id: integrity
        if: steps.changes.outputs.changed == 'true'
        run: python -m wechat_sync.validate

      - name: Set up Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install website dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Build production website
        id: build
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Commit synchronized content
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/articles public/article-assets wechat_sync/index.json
          git commit -m "content: sync WeChat articles"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Close resolved synchronization alert
        if: >-
          ${{ always() && !failure() &&
              steps.credentials.outcome == 'success' &&
              steps.synchronize.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issue_number="$(gh issue list --state open --search '微信公众号自动同步失败 in:title' --json number --jq '.[0].number // empty' || true)"
          if [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" --comment "自动同步已恢复：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
          fi

      - name: Report automation failure
        if: >-
          ${{ always() &&
              (failure() ||
               steps.credentials.outcome == 'failure' ||
               steps.synchronize.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "## 微信公众号自动同步失败"
            echo
            if [[ "${{ steps.credentials.outcome }}" == "failure" ]]; then
              echo '未读取到 `WEREAD_VID` 或 `WEREAD_TOKEN`。请确认 Repository Secret 名称完整，不能写成 `VID` 或 `TOKEN`。'
            else
              echo "请检查微信读书凭据、公开中转服务限流、文章资源下载或 Astro 构建日志。"
            fi
            echo
            echo "运行记录：${run_url}"
          } >> "$GITHUB_STEP_SUMMARY"

          issue_number="$(gh issue list --state open --search '微信公众号自动同步失败 in:title' --json number --jq '.[0].number // empty' || true)"
          if [[ "${{ steps.credentials.outcome }}" == "failure" ]]; then
            guidance='未读取到 `WEREAD_VID` 或 `WEREAD_TOKEN`。请在 Repository secrets 中使用完整名称；`VID` 和 `TOKEN` 无效。名称错误时不需要重新扫码。'
          else
            guidance='若日志提示 401，请在本地重新扫码并更新 `WEREAD_VID`、`WEREAD_TOKEN`；若提示 429，请等待下次定时任务。'
          fi
          body="$(printf '自动同步未完成。请查看运行记录：%s\n\n%s' "$run_url" "$guidance")"
          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --body "$body" || true
          else
            gh issue create --title "微信公众号自动同步失败" --body "$body" --label "automation" || \
              gh issue create --title "微信公众号自动同步失败" --body "$body" || true
          fi
          exit 1
