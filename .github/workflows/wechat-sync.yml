name: WeChat Article Sync

on:
  schedule:
    # Articles are published before 09:00 and before 16:30 (Asia/Shanghai).
    # Run ~5-10 min after each window so new posts appear on the site quickly.
    # GitHub may still execute a scheduled run late (occasionally ~30 min),
    # which only delays the sync — the article is already published.
    # Offset off the :00/:30 high-load minutes where GitHub may delay/drop runs.
    - cron: "7 9 * * *"
      timezone: "Asia/Shanghai"
    - cron: "37 16 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      max_pages:
        description: Maximum newest article-list pages to inspect per WeChat source
        required: false
        default: "1"

permissions:
  contents: write
  issues: write

concurrency:
  group: wechat-article-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RAPIDAPI_KEYS: ${{ secrets.RAPIDAPI_KEYS }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      SYNC_MAX_PAGES: ${{ inputs.max_pages || '1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check synchronization credentials
        id: credentials
        continue-on-error: true
        shell: bash
        run: |
          if [[ -z "$RAPIDAPI_KEYS" && -z "$RAPIDAPI_KEY" ]]; then
            echo "::error title=Repository Secret 名称或配置错误::未读取到 RAPIDAPI_KEYS，也没有可兼容使用的 RAPIDAPI_KEY。"
            {
              echo "## Repository Secrets 配置错误"
              echo
              echo '请在 `Settings -> Secrets and variables -> Actions` 中创建：'
              echo
              echo '- `RAPIDAPI_KEYS`（推荐，JSON 字符串数组形式的 Key 池）'
              echo
              echo '单个 `RAPIDAPI_KEY` 仅作为兼容后备。不要继续配置微信读书扫码凭据。'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-wechat.txt

      - name: Install synchronizer dependencies
        run: pip install -r requirements-wechat.txt

      - name: Synchronize articles
        id: synchronize
        if: steps.credentials.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          echo "同步模式：历史文章 V2 直接增量"
          {
            echo "## 文章列表同步策略"
            echo
            echo "- 历史文章 V1 已被提供方弃用，本任务直接使用 V2 获取两个公众号的最新文章。"
          } >> "$GITHUB_STEP_SUMMARY"
          python -m wechat_sync.sync --max-pages "$SYNC_MAX_PAGES" --delay 3

      - name: Detect generated changes
        id: changes
        if: always()
        env:
          SYNC_OUTCOME: ${{ steps.synchronize.outcome }}
        shell: bash
        run: |
          new_article_count="$(git ls-files --others --exclude-standard -- src/content/articles | wc -l | tr -d ' ')"
          echo "new_article_count=$new_article_count" >> "$GITHUB_OUTPUT"
          if [[ "$new_article_count" -gt 0 ]]; then
            echo "has_new_articles=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new_articles=false" >> "$GITHUB_OUTPUT"
            if [[ "$SYNC_OUTCOME" == "success" ]]; then
              {
                echo "## 本次没有新增文章"
                echo
                echo "同步成功，但未生成新的文章文件，因此不会创建空提交。"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Validate generated archive
        id: integrity
        if: steps.changes.outputs.has_new_articles == 'true'
        run: python -m wechat_sync.validate

      - name: Set up Node.js
        if: steps.changes.outputs.has_new_articles == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install website dependencies
        if: steps.changes.outputs.has_new_articles == 'true'
        run: npm ci

      - name: Build production website
        id: build
        if: steps.changes.outputs.has_new_articles == 'true'
        run: npm run build

      - name: Commit synchronized content
        if: steps.changes.outputs.has_new_articles == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/articles public/article-assets wechat_sync/indexes
          article_count="$(git diff --cached --name-only --diff-filter=A -- src/content/articles | wc -l | tr -d ' ')"
          if [[ "$article_count" -eq 0 ]]; then
            echo "暂存区没有新增文章文件，跳过提交。"
            exit 0
          fi
          if [[ "$article_count" == "1" ]]; then
            article_label="article"
          else
            article_label="articles"
          fi
          sync_date="$(TZ=Asia/Shanghai date +%F)"
          git commit -m "content: sync ${article_count} WeChat ${article_label} (${sync_date})"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Close resolved synchronization alert
        if: >-
          ${{ always() && !failure() &&
              steps.credentials.outcome == 'success' &&
              steps.synchronize.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issue_number="$(gh issue list --state open --search '微信公众号自动同步失败 in:title' --json number --jq '.[0].number // empty' || true)"
          if [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" --comment "自动同步已恢复：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
          fi

      - name: Report automation failure
        if: >-
          ${{ always() &&
              (failure() ||
               steps.credentials.outcome == 'failure' ||
               steps.synchronize.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "## 微信公众号自动同步失败"
            echo
            if [[ "${{ steps.credentials.outcome }}" == "failure" ]]; then
              echo '未读取到 `RAPIDAPI_KEYS`，也没有读取到兼容用的 `RAPIDAPI_KEY`。'
            else
              echo "请检查 RapidAPI 配额、第三方采集状态、文章资源下载或 Astro 构建日志。"
            fi
            echo
            echo "运行记录：${run_url}"
          } >> "$GITHUB_STEP_SUMMARY"

          issue_number="$(gh issue list --state open --search '微信公众号自动同步失败 in:title' --json number --jq '.[0].number // empty' || true)"
          if [[ "${{ steps.credentials.outcome }}" == "failure" ]]; then
            guidance='请上传 Key 池 Secret `RAPIDAPI_KEYS`；单个 `RAPIDAPI_KEY` 仅作为兼容后备。'
          else
            guidance='同步器直接使用历史文章 V2。若所有 Key 均提示 401/403，请检查订阅和 Key；若提示 429 或 Pro 配额耗尽，请补充 Key 或等待月度重置；业务码 300/301 与 HTTP 5xx 通常是上游接口故障。'
          fi
          body="$(printf '自动同步未完成。请查看运行记录：%s\n\n%s' "$run_url" "$guidance")"
          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --body "$body" || true
          else
            gh issue create --title "微信公众号自动同步失败" --body "$body" --label "automation" || \
              gh issue create --title "微信公众号自动同步失败" --body "$body" || true
          fi
          exit 1
